# Build the Hycl.Online plugin from the Hycl launcher source and publish it.
# - Triggered manually (version inputs); no longer chained to a Terracotta sync job.
# - Single source of truth for the version: <Version> in the plugin csproj.
# - After publishing, refreshes online.json (plugins[0]) and pushes; the
#   Deploy EdgeOne workflow then picks the manifest change up automatically.
name: Build Plugin

on:
  workflow_dispatch:
    inputs:
      hycl_repo:
        description: "Hycl launcher source repository"
        default: "muqiu-pika/Hycl"
      hycl_ref:
        description: "Hycl source ref"
        default: "main"
      version:
        description: "Plugin version override (empty = read from csproj <Version>)"
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout this repository (scripts + manifest)
        uses: actions/checkout@v5

      - name: Checkout Hycl launcher source
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.inputs.hycl_repo || 'muqiu-pika/Hycl' }}
          ref: ${{ github.event.inputs.hycl_ref || 'main' }}
          token: ${{ secrets.HYCL_REPO_TOKEN != '' && secrets.HYCL_REPO_TOKEN || github.token }}
          path: hycl

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Resolve plugin version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          csproj="hycl/src/Hycl.Launcher.Plugin.Online/Hycl.Launcher.Plugin.Online.csproj"
          csprojVersion=$(node -e "const m=require('fs').readFileSync(process.argv[1],'utf8');const v=m.match(/<Version>([^<]+)<\/Version>/);console.log(v?v[1]:'0.0.0')" "$csproj")
          version="${INPUT_VERSION:-$csprojVersion}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "plugin version: $version"

      - name: Publish plugin
        run: dotnet publish "hycl/src/Hycl.Launcher.Plugin.Online/Hycl.Launcher.Plugin.Online.csproj" -c Release -o publish

      - name: Pack plugin zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          mkdir -p pack
          cp publish/Hycl.Online.dll pack/
          node -e "const fs=require('fs');fs.writeFileSync('pack/plugin.json', JSON.stringify({id:'hycl.online',name:'陶瓦联机',version:process.env.VERSION,abi:1,entry:'Hycl.Online.dll',minLauncherVersion:'1.0.0'},null,2)+'\n')"
          (cd pack && zip -q "../Hycl.Online-$VERSION.zip" plugin.json Hycl.Online.dll)
          ls -l "Hycl.Online-$VERSION.zip"

      - name: Check whether release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "plugin-v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release plugin-v$VERSION already exists; skip publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "plugin-v$VERSION" \
            --title "Hycl.Online v$VERSION" \
            --notes "Hycl 陶瓦联机插件包。安装/启用：Hycl 设置 → 插件工坊；启用后到工具页点「进入」打开功能设置页。包含 plugin.json + Hycl.Online.dll；Terracotta 工具本体由插件从官方镜像与官方仓库在线下载（全平台）。" \
            "Hycl.Online-$VERSION.zip"

      - name: Refresh manifest
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          node scripts/update-manifest.cjs plugin --zip "Hycl.Online-$VERSION.zip" --repo "$GITHUB_REPOSITORY"
          git config user.name "hycl-online-bot"
          git config user.email "actions@users.noreply.github.com"
          git add online.json
          git commit -m "chore(plugin): release v$VERSION"
          git push

  verify:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Plugin entry check
        run: |
          node -e "
          const m=require('./online.json');
          const p=(m.plugins||[]).find(item=>item.id==='hycl.online');
          if(!p) throw new Error('manifest missing plugins[hycl.online]');
          if(!p.version) throw new Error('plugin version missing');
          if(!/^([0-9a-f]{64})$/.test(p.sha256||'')) throw new Error('plugin sha256 missing');
          if(!(Number(p.size)>0)) throw new Error('plugin size missing');
          if(!/^https:\/\//.test(p.url||'')) throw new Error('plugin url missing');
          for(const url of [p.url, ...(p.mirrors||[])]) new URL(url);
          console.log('plugin entry OK: v'+p.version+' '+p.url);"

      - name: Primary source reachability check
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const m = JSON.parse(readFileSync('./online.json', 'utf8'));
          const p = (m.plugins || []).find(item => item.id === 'hycl.online');
          const urls = [p?.url, ...(p?.mirrors || [])].filter(Boolean);
          if (!urls.length) throw new Error('no plugin urls');
          const bad = [];
          for (const url of urls) {
            let status = 0;
            try {
              let res = await fetch(url, { method: 'HEAD' });
              if (res.status !== 200) {
                // 对 HEAD 不友好的端点改用 Range GET 复核
                res = await fetch(url, { headers: { Range: 'bytes=0-0' } });
                await res.body?.cancel();
              }
              status = res.status;
            } catch (error) {
              bad.push(url + ': network error ' + error.message);
              continue;
            }
            console.log('HTTP ' + status + '  ' + url);
            if (![200, 206, 302, 303].includes(status)) bad.push(url + ': HTTP ' + status);
          }
          if (bad.length) {
            console.error('unreachable plugin sources:\n' + bad.join('\n'));
            process.exit(1);
          }
          console.log('plugin sources reachable');"
