# Verify the distribution bundle for the EdgeOne Pages site (custom-domain primary source).
# Actual deployment is handled by the EdgeOne Pages Git-connected project:
#   Build command:      node scripts/build-dist.cjs
#   Build output dir:   dist
#   Root dir:           ./
# That project has Provider 'Github', so CLI direct folder/zip deployment is rejected
# ("Only projects with Provider 'Upload' are supported"). This workflow therefore only
# assembles and verifies dist/ (SHA-256 checked in build-dist.cjs and update-manifest.cjs
# stage), keeping an independent green health check on every manifest update.
# Requires repository VARIABLE EDGEONE_SITE_URL, e.g. https://hyclonline.mcapp.eu.org
# (MUST be the bound custom domain, NOT a *.edgeone.app / *.edgeone.dev preview domain).
name: Deploy EdgeOne

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - online.json
      - scripts/build-dist.cjs
      - scripts/update-manifest.cjs

permissions:
  contents: read

jobs:
  deploy:
    # 自动触发且未配置站点 Variable 时整作业跳过；手动触发时进入作业并明确报出缺失项。
    if: ${{ vars.EDGEONE_SITE_URL != '' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify EdgeOne configuration
        env:
          EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
        run: |
          set -e
          if [ -z "$EDGEONE_SITE_URL" ]; then
            echo "::error::缺少仓库 Variable EDGEONE_SITE_URL。路径：Settings > Secrets and variables > Actions > Variables > New repository variable；值填 https://hyclonline.mcapp.eu.org（结尾不带 /）。"
            exit 1
          fi
          echo "EdgeOne config OK: $EDGEONE_SITE_URL"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assemble dist
        env:
          EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
        run: |
          set -e
          node scripts/build-dist.cjs
          echo "::notice::dist assembled and verified; deployment is handled by the EdgeOne Pages Git integration"

      - name: Report deployment handoff
        run: |
          echo "Bundle verified. EdgeOne Pages builds this repository on every push and"
          echo "publishes dist/ (build command: node scripts/build-dist.cjs, output: dist)."
          echo "CLI direct upload is intentionally not used: the project provider is Github."
