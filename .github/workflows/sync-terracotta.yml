# Sync Terracotta packages from the upstream release into this repository.
# - Daily schedule + manual dispatch.
# - When burningtnt/Terracotta publishes a new version, download the 6 platform
#   packages, upload them to a release in THIS repo, and rewrite online.json.
name: Sync Terracotta

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Probe upstream version
        id: probe
        run: |
          set +e
          output=$(node scripts/update-manifest.cjs probe)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            version=$(echo "$output" | awk '/^UPDATE /{print $2}')
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Fetch upstream packages
        if: steps.probe.outputs.changed == 'true'
        run: node scripts/update-manifest.cjs fetch --version "${{ steps.probe.outputs.version }}" --out _sync

      - name: Create release with packages
        if: steps.probe.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.probe.outputs.version }}"
          gh release create "terracotta-v$version" \
            --title "Terracotta v$version" \
            --notes "Terracotta packages synced from burningtnt/Terracotta v$version (AGPL-3.0). Upstream: https://github.com/burningtnt/Terracotta" \
            _sync/*.tar.gz

      - name: Rewrite manifest
        if: steps.probe.outputs.changed == 'true'
        run: node scripts/update-manifest.cjs apply --version "${{ steps.probe.outputs.version }}" --report _sync/report.json --repo "${{ github.repository }}"

      - name: Commit manifest
        if: steps.probe.outputs.changed == 'true'
        run: |
          version="${{ steps.probe.outputs.version }}"
          git config user.name "hycl-online-bot"
          git config user.email "actions@users.noreply.github.com"
          git add online.json
          git commit -m "chore(terracotta): sync v$version"
          git push
